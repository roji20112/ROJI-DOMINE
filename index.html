<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>لعبة الديناصور</title>
<style>
  :root{
    --bg:#f4f4f4;
    --ground:#757575;
    --player:#222;
    --ob:#2b2b2b;
    --accent:#0b84ff;
  }
  html,body{height:100%;margin:0;font-family:Verdana,Arial;direction:rtl}
  body{display:flex;align-items:center;justify-content:center;background:var(--bg)}
  #gameWrap{width:900px;max-width:96vw;background:#fff;border-radius:8px;box-shadow:0 6px 30px rgba(0,0,0,.08);padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  h1{font-size:18px;margin:0;color:#111}
  .controls{font-size:14px;color:#444}
  #canvas{background:linear-gradient(#eaf0ff, #fff);display:block;border-radius:6px;width:100%;height:300px}
  .info{display:flex;gap:12px;align-items:center;margin-top:8px}
  .score{font-weight:700;color:var(--accent)}
  button{background:var(--accent);color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
  button:active{transform:translateY(1px)}
  footer{margin-top:8px;color:#666;font-size:13px}
  /* small hint */
  .hint{font-size:13px;color:#666}
</style>
</head>
<body>
<div id="gameWrap" role="application" aria-label="لعبة ديناصور">
  <header>
    <h1>لعبة الديناصور</h1>
    <div class="controls">
      <span class="hint">اضغط مسافة / اسهم للأعلى للقفز — اضغط لأسفل للإنزلاق</span>
    </div>
  </header>

  <canvas id="canvas" width="900" height="300" tabindex="0"></canvas>

  <div class="info" style="justify-content:space-between">
    <div>
      <span>النتيجة: </span><span id="score" class="score">0</span>
    </div>
    <div>
      <button id="startBtn">ابدأ أو أعد اللعب</button>
    </div>
  </div>

  <footer>لمصمّم بسيط — يعمل على الموبايل (اضغط الشاشة للقفز)</footer>
</div>

<script>
/* لعبة ديناصور بسيطة — مدمج في ملف واحد
   - كائن اللاعب: يقفز وينزلق
   - عقبات عشوائية
   - عداد نقاط متزايد
   - دعم لمس للموبايل + مفاتيح لوحة المفاتيح
*/

(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');

  let W = canvas.width, H = canvas.height;
  let running = false, gameOver = false;
  let score = 0, speed = 6, spawnTimer = 0, spawnInterval = 90;

  // اللاعب
  const player = {
    x: 50,
    y: H - 70,
    width: 44,
    height: 44,
    vy: 0,
    gravity: 1.6,
    jumpForce: -18,
    grounded: true,
    ducking: false,
    draw() {
      ctx.save();
      ctx.fillStyle = '#222';
      // رسم بسيط: مربع مع عين
      if (this.ducking) {
        ctx.fillRect(this.x, this.y + 18, this.width, this.height - 18);
      } else {
        ctx.fillRect(this.x, this.y, this.width, this.height);
      }
      // عين
      ctx.fillStyle = '#fff';
      ctx.fillRect(this.x + 28, this.y + (this.ducking ? 28 : 12), 6, 6);
      ctx.restore();
    },
    update() {
      // تطبيق الجاذبية
      this.vy += this.gravity;
      this.y += this.vy;

      // اصطدام بالأرض
      const groundY = H - 50; // فوق الأرض بمقدار player's height
      if (this.y + this.height >= groundY) {
        this.y = groundY - this.height;
        this.vy = 0;
        this.grounded = true;
      } else {
        this.grounded = false;
      }
    },
    jump() {
      if (this.grounded) {
        this.vy = this.jumpForce;
        this.grounded = false;
        this.ducking = false;
      }
    },
    duck(state) {
      if (this.grounded) {
        this.ducking = state;
      }
    },
    getRect() {
      // يصغر ال-hitbox عند الانزلاق
      if (this.ducking) return {x:this.x, y:this.y+18, w:this.width, h:this.height-18};
      return {x:this.x, y:this.y, w:this.width, h:this.height};
    }
  };

  // عقبات
  let obstacles = [];
  function spawnObstacle() {
    const type = Math.random() < 0.6 ? 'cactus' : 'ptero';
    if (type === 'cactus') {
      const h = 30 + Math.random()*40;
      obstacles.push({
        kind: 'cactus',
        x: W + 20,
        y: H - 50 - h,
        w: 20 + Math.floor(Math.random()*18),
        h: h,
      });
    } else {
      // ديناصور طائر
      const size = 34;
      const yOptions = [H - 160, H - 120, H - 80];
      obstacles.push({
        kind: 'ptero',
        x: W + 20,
        y: yOptions[Math.floor(Math.random()*yOptions.length)],
        w: size,
        h: size,
      });
    }
  }

  // رسم الأرض
  function drawGround(offset) {
    const groundY = H - 50;
    ctx.fillStyle = '#e7e7e7';
    ctx.fillRect(0, groundY, W, 50);
    // بعض أحجار الطريق المتحركة
    ctx.fillStyle = '#757575';
    for (let i = -40; i < W + 40; i += 40) {
      const px = (i + offset) % (W + 80);
      ctx.fillRect(px, groundY + 28, 12, 6);
    }
  }

  // فحص التصادم
  function rectsCollide(a,b) {
    return !(a.x + a.w < b.x || a.x > b.x + b.w || a.y + a.h < b.y || a.y > b.y + b.h);
  }

  // إعادة تعيين اللعبة
  function reset() {
    running = true;
    gameOver = false;
    score = 0;
    speed = 6;
    spawnTimer = 0;
    obstacles = [];
    player.y = H - 50 - player.height;
    player.vy = 0;
    player.ducking = false;
    scoreEl.textContent = score;
    loop();
  }

  // الحلقة الرئيسية
  let lastTime = 0, groundOffset = 0;
  function loop(ts) {
    if (!running) return;
    requestAnimationFrame(loop);

    // حساب فروق الوقت (غير ضروري هنا لكنه مفيد لو أردنا تعويض فريم)
    const dt = (ts - lastTime) || 16;
    lastTime = ts;

    // مسح
    ctx.clearRect(0,0,W,H);

    // تحديث وتوليد عقبات
    spawnTimer++;
    if (spawnTimer > spawnInterval) {
      spawnTimer = 0;
      spawnInterval = 60 + Math.floor(Math.random()*80) - Math.floor(score/200); // تزداد صعوبة
      spawnObstacle();
    }

    // تحديث سرعة حسب النتيجة
    speed = 6 + Math.floor(score/100);

    // تحديث اللاعب
    player.update();

    // تحديث عقبات وتحريكها
    for (let i = obstacles.length-1; i >= 0; i--) {
      obstacles[i].x -= speed;
      // إزالة إن خرجت من الشاشة
      if (obstacles[i].x + obstacles[i].w < -50) obstacles.splice(i,1);
    }

    // رسم الخلفية (شمس / سحب بسيطة)
    ctx.fillStyle = '#f2f8ff';
    ctx.fillRect(0,0,W,H - 100);

    // رسم الأرض وعناصرها
    groundOffset -= speed;
    drawGround(groundOffset);

    // رسم اللاعب
    player.draw();

    // رسم العقبات
    obstacles.forEach(obs => {
      ctx.save();
      ctx.fillStyle = '#2b2b2b';
      if (obs.kind === 'cactus') {
        // رسم صندوق بسيط مع نتوءات
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.fillStyle = '#1f1f1f';
        ctx.fillRect(obs.x + 4, obs.y - 6, 6, 6);
      } else {
        // ptero - شكل جناحي مبسط
        ctx.beginPath();
        ctx.moveTo(obs.x, obs.y + obs.h/2);
        ctx.lineTo(obs.x + obs.w/2, obs.y);
        ctx.lineTo(obs.x + obs.w, obs.y + obs.h/2);
        ctx.lineTo(obs.x + obs.w/2, obs.y + obs.h);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    });

    // فحص التصادم
    const prect = player.getRect();
    for (let obs of obstacles) {
      const orect = {x: obs.x, y: obs.y, w: obs.w, h: obs.h};
      if (rectsCollide({x:prect.x,y:prect.y,w:prect.w,h:prect.h}, orect)) {
        // اصطدام -> نهاية اللعبة
        running = false;
        gameOver = true;
        showGameOver();
        return;
      }
    }

    // تحديث وإظهار النتيجة
    score += 1;
    scoreEl.textContent = score;

    // رسم شريط السرعة/مستوى (اختياري)
    ctx.fillStyle = '#00000022';
    ctx.fillRect(12,12,180,8);
    ctx.fillStyle = '#0b84ff';
    ctx.fillRect(12,12,Math.min(180, 40 + score/5),8);
  }

  function showGameOver() {
    // لوحة بسيطة
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff';
    ctx.font = '28px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('انتهت اللعبة', W/2, H/2 - 10);
    ctx.font = '16px Arial';
    ctx.fillText('النقاط: ' + score, W/2, H/2 + 18);
    ctx.restore();
  }

  // إدخال: لوحة المفاتيح + لمس
  // قفز = مسافة أو سهم أعلى، انزلاق = سهم لأسفل
  function onKeyDown(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (!running) { reset(); } else player.jump();
    } else if (e.code === 'ArrowDown') {
      player.duck(true);
    }
  }
  function onKeyUp(e) {
    if (e.code === 'ArrowDown') player.duck(false);
  }

  // لمس للشاشات: لمسة سريعة = قفز، لمس مطوّل = انزلاق
  let touchStartTime = 0;
  canvas.addEventListener('touchstart', (ev) => {
    ev.preventDefault();
    touchStartTime = Date.now();
    if (!running) { reset(); return; }
    // فورياً نقفز
    player.jump();
  }, {passive:false});
  canvas.addEventListener('touchend', (ev) => {
    ev.preventDefault();
    const dur = Date.now() - touchStartTime;
    if (dur > 400) {
      // لمسة طويلة -> انزلاق قصير
      player.duck(true);
      setTimeout(()=>player.duck(false), 500);
    }
  }, {passive:false});

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);

  // زر البداية
  startBtn.addEventListener('click', () => {
    reset();
    canvas.focus();
  });

  // احجام متغيرة
  function resizeCanvas() {
    // نحافظ على نسبة داخلية لكن نترك رسوم ثابتة
    const rect = canvas.getBoundingClientRect();
    // نغير الأبعاد الفيزيائية للعرض ليتناسب مع CSS لكن نترك النظام الداخلي ثابت (900x300) لتبسيط الرسم
    canvas.width = 900;
    canvas.height = 300;
    W = canvas.width; H = canvas.height;
    player.y = H - 50 - player.height;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // نبدأ اللعبة مع توجيه المستخدم للضغط للبدء
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#111';
  ctx.font = '18px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('اضغط "ابدأ أو أعد اللعب" أو اضغط مسافة للقفز لبدء اللعبة', W/2, H/2);
})();
</script>
</body>
</html>
