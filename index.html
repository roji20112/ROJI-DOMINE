<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>رفع صورة وإرسالها للتلغرام</title>
</head>
<body>
  <h2>ارفع صورة ليتم إرسالها للتلغرام</h2>
  <input type="file" id="imageInput" accept="image/*">
  <button onclick="sendToTelegram()">إرسال للصورة</button>
  <p id="status"></p>

  <script>
    const BOT_TOKEN = "7710816011:AAHV5ybc-Hwet8IdL1TwbJfWYhmsxxG2T_8";
    const CHAT_ID = "6251932709";

    async function sendToTelegram() {
      const input = document.getElementById('imageInput');
      const status = document.getElementById('status');

      if (input.files.length === 0) {
        status.textContent = "يرجى اختيار صورة أولاً!";
        return;
      }

      const file = input.files[0];
      const formData = new FormData();
      formData.append("chat_id", CHAT_ID);
      formData.append("photo", file);

      status.textContent = "جارٍ الإرسال...";

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: "POST",
          body: formData
        });

        const result = await response.json();
        if (result.ok) {
          status.textContent = "تم إرسال الصورة بنجاح!";
        } else {
          status.textContent = "فشل الإرسال: " + result.description;
        }
      } catch (error) {
        status.textContent = "حدث خطأ: " + error;
      }
    }
  </script>
</body>
</html>
