<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>التقاط صورة وإرسالها لتليغرام</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; direction: rtl; padding: 18px; max-width: 820px; margin: auto; }
    h1 { margin-bottom: 6px; }
    .controls { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; }
    video, canvas { border: 1px solid #ccc; max-width: 100%; height: auto; display: block; }
    .preview { margin-top: 10px; }
    button { padding: 8px 12px; cursor: pointer; }
    #status { margin-top: 10px; color: #333; }
    .small { font-size: 0.9em; color: #666; }
  </style>
</head>
<body>
  <h1>التقاط صورة وإرسالها لتليغرام</h1>
  <p class="small">اضغط "فتح الكاميرا" للسماح بالوصول. بعد التقاط الصورة، يمكنك معاينتها ثم إرسالها للبوت.</p>

  <div class="controls">
    <button id="openCamBtn">فتح الكاميرا</button>
    <button id="captureBtn" disabled>التقاط</button>
    <button id="stopCamBtn" disabled>إيقاف الكاميرا</button>
    <input type="file" id="fileInput" accept="image/*">
    <button id="sendFileBtn">إرسال الملف المحدد</button>
  </div>

  <div>
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div class="preview">
    <h3>المعاينة</h3>
    <img id="previewImg" alt="لا توجد صورة" style="max-width:100%; border:1px solid #ddd; padding:6px;">
  </div>

  <div id="status"></div>

  <script>
    // --- ضع هنا التوكن والمعرف الذي أعطيته لي ---
    const BOT_TOKEN = "7710816011:AAHV5ybc-Hwet8IdL1TwbJfWYhmsxxG2T_8";
    const CHAT_ID = "6251932709";
    // -------------------------------------------

    const openCamBtn = document.getElementById('openCamBtn');
    const captureBtn = document.getElementById('captureBtn');
    const stopCamBtn = document.getElementById('stopCamBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const previewImg = document.getElementById('previewImg');
    const status = document.getElementById('status');
    const fileInput = document.getElementById('fileInput');
    const sendFileBtn = document.getElementById('sendFileBtn');

    let stream = null;
    let lastBlob = null;

    function setStatus(msg, isError = false) {
      status.textContent = msg;
      status.style.color = isError ? 'crimson' : '#333';
    }

    openCamBtn.addEventListener('click', async () => {
      setStatus('طلب إذن الكاميرا...');
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        video.srcObject = stream;
        video.style.display = 'block';
        captureBtn.disabled = false;
        stopCamBtn.disabled = false;
        setStatus('الكاميرا مفتوحة. اضغط "التقاط" لالتقاط صورة.');
      } catch (err) {
        console.error(err);
        setStatus('فشل الوصول للكاميرا: ' + (err.message || err), true);
      }
    });

    captureBtn.addEventListener('click', () => {
      if (!stream) { setStatus('الكاميرا غير متاحة.', true); return; }
      const w = video.videoWidth;
      const h = video.videoHeight;
      if (!w || !h) { setStatus('الكاميرا لم تبدأ بعد. انتظر ثواني وحاول مرة أخرى.', true); return; }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);
      canvas.toBlob(blob => {
        if (!blob) { setStatus('فشل إنشاء الصورة.', true); return; }
        lastBlob = blob;
        const url = URL.createObjectURL(blob);
        previewImg.src = url;
        setStatus('تم التقاط الصورة. يمكنك إرسالها إلى التليغرام.');
      }, 'image/jpeg', 0.9);
    });

    stopCamBtn.addEventListener('click', () => {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      video.style.display = 'none';
      captureBtn.disabled = true;
      stopCamBtn.disabled = true;
      setStatus('تم إيقاف الكاميرا.');
    });

    // إرسال الـ Blob الملتقطة
    async function sendBlobToTelegram(blob) {
      if (!blob) { setStatus('لا توجد صورة لإرسالها.', true); return; }
      setStatus('جارٍ إرسال الصورة إلى التليغرام...');
      const form = new FormData();
      form.append('chat_id', CHAT_ID);
      form.append('photo', blob, 'photo.jpg'); // اسم الملف اختياري

      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: form
        });
        const data = await res.json();
        if (data && data.ok) {
          setStatus('تم إرسال الصورة بنجاح ✅');
        } else {
          console.error('telegram error', data);
          setStatus('فشل الإرسال: ' + (data && data.description ? data.description : 'استجابة غير متوقعة'), true);
        }
      } catch (err) {
        console.error(err);
        setStatus('خطأ أثناء الإرسال: ' + err.message, true);
      }
    }

    // زر إرسال الملف الذي تم اختياره من الجهاز
    sendFileBtn.addEventListener('click', async () => {
      // أفضل سلوك: إذا المستخدم التقط صورة بالكاميرا (lastBlob) نرسلها، وإلا نرسل الملف المحدد من input
      if (lastBlob) {
        // نطلب تأكيد واضح من المستخدم قبل الإرسال
        if (!confirm('هل أنت متأكد أنك تريد إرسال الصورة الملتقطة إلى التليغرام؟')) return;
        await sendBlobToTelegram(lastBlob);
        return;
      }
      const file = fileInput.files[0];
      if (!file) { setStatus('اختر ملفًا أولاً أو التقط صورة بالكاميرا.', true); return; }
      // معاينة الملف المحدد
      previewImg.src = URL.createObjectURL(file);
      if (!confirm('هل أنت متأكد أنك تريد إرسال الملف المحدد إلى التليغرام؟')) return;
      await sendBlobToTelegram(file);
    });

    // عند اختيار ملف من input نعرضه في المعاينة (لكن لا نرسله تلقائياً)
    fileInput.addEventListener('change', () => {
      const f = fileInput.files[0];
      if (!f) { previewImg.src = ''; setStatus(''); return; }
      previewImg.src = URL.createObjectURL(f);
      lastBlob = null; // الملف المختار ليس نفس lastBlob الملتقطة
      setStatus('تم اختيار ملف للمعاينة. اضغط "إرسال الملف المحدد" لإرساله.');
    });

    // تنظيف عند مغادرة الصفحة
    window.addEventListener('beforeunload', () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
    });

  </script>
</body>
</html>
