<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تصوير الكاميرا</title>
<style>
  body { text-align:center; font-family:Arial; margin-top:40px; }
  video, canvas { display:block; margin:0 auto; }
  button { margin-top:15px; padding:10px 20px; font-size:16px; }
</style>
</head>
<body>
  <h1>التقط صورة بالكاميرا</h1>
  <video id="video" width="320" height="240" autoplay></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <button id="capture">📸 التقط وأرسل</button>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const button = document.getElementById('capture');

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => video.srcObject = stream);

    button.onclick = async () => {
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const dataUrl = canvas.toDataURL('image/png');

      await fetch('/send_photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl })
      });

      alert("📤 تم إرسال الصورة!");
    };
  </script>
</body>
</html>
